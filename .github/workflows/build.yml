name: Build and Release

on:
  push:
    tags: ['v*']  # Only trigger on version tags
  workflow_dispatch:  # Allow manual trigger for testing

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git describe

      - name: Extract version from tag
        id: version
        run: |
          # Get version from tag, strip 'v' prefix
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = $tag
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Building version: $version"
          
          # Write VERSION file for PyInstaller and Inno Setup
          Set-Content -Path "VERSION" -Value $version -NoNewline

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller vox-native-transcription.spec
          echo "PyInstaller build complete"
          dir dist\Vox

      - name: Build installer with Inno Setup
        run: |
          # Inno Setup is pre-installed on GitHub Windows runners
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          echo "Installer built successfully"
          dir dist\*.exe

      - name: Create portable zip
        run: |
          Compress-Archive -Path dist\Vox\* -DestinationPath dist\Vox-Portable-${{ steps.version.outputs.VERSION }}.zip
          echo "Portable zip created"
          dir dist\*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Vox ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/Vox-Setup-${{ steps.version.outputs.VERSION }}.exe
            dist/Vox-Portable-${{ steps.version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
